    	required string task_status = 7;
    	required string task_uuid = 8;
    	required uint64 task_version = 9;

    	required string push_id = 10;
	required string descrip = 11;
	required string operation = 12;
	required string operator_id = 13;
    	required string operator_name = 14;
}

