enum LoginType {
	NAME	= 1;
	PHONE	= 2;
	EMAIL	= 3;
}

enum OnlineStat{
	OFFLINE	= 0;
	ONLINE	= 1;
	STEALTH = 2;
	BUSY	= 3;
	LEAVE	= 4;
	MOBILE_BACKGROUND = 5;
}

enum DeviceType {
	DEV_UNKNOWN	= 0;
	DEV_PC      	= 1;
    DEV_MACOSX  	= 2;
	DEV_ANDROID	= 3;
	DEV_IPHONE	= 4;
	DEV_IPAD	= 5;
	DEV_WX	= 100;
}

enum ChagMsgType {
	TEXT = 1;
	VOICE = 2;
	IMAGE = 3;
	SHAKE = 4;
	TRANSFER = 5;
	SHARE = 6;
	LINK = 7;
	OA = 8;
	
	TEXT_V2 = 100001;
	VOICE_V2 = 200001;
	FILE = 500001;

	SYSGROUPNOTIFY = 10000;
	SYSNOTIFY	   = 10001;
}

enum RemindType {
	REMIND_SHAKE = 1;
	REMIND_MOBILEPUSH = 2;
}

enum GroupType {
	GROUP_NONE = 0;
	GROUP_NORMAL = 1;
	GROUP_TEMP = 2;
	GROUP_TASK = 3;

	GROUP_DEPT = 100;
}

enum GroupMemRole {
	GROUP_ROLE_CREATOR = 0;
	GROUP_ROLE_MANAGER = 1;
	GROUP_ROLE_MEMBER = 2;
}

enum IMSessionType {
	IM_SESSION_NONE = 0;
	IM_SESSION_PRIVATE_NORMAL = 10001;
	IM_SESSION_GROUP_NORMAL = 20001;
	IM_SESSION_GROUP_DEPT	= 20002;
	IM_SESSION_OA_NORMAL	= 30001;
	IM_SESSION_APP_NORMAL	= 40001;
}

// message timeout
message TimeoutMsg {
	required uint32		id = 1;
	required RequestType    type = 2;
}

// hello request message
message HelloReq {
	required uint32		id 		= 1;
	required int64		param1 	= 2;
	required int64		param2 	= 3;
}

// hello response message
message HelloResp {
	required uint32		id 		= 1;
	required int32		errorno 	= 2;
	optional string		msg 	= 3;
}

// login request message
message LoginReq {
	required uint32		id			= 1;
	required string		identifier	= 2;
	required string		password	= 3;
	required LoginType 	login_type 	= 4;
}

// login response message
message LoginResp {
	required uint32		id		= 1;
	required int32		errorno 	= 2;
	optional string		msg		= 3;
        optional int32		http_result 	= 4;
}

//
message LoginWithTokenReq {
	required uint32 id = 1;
	required string token = 2;
	required string user_uuid = 3;
}

message LoginWithTokenResp {
	required uint32 id = 1;
	required int32 errorno = 2;
	optional int32 http_result = 3;
	optional string msg = 4;
}

// online request message
message OnlineReq {
	required uint32		id			= 1;
	required string		comp_uuid	= 2;
	required string		identifier 	= 3;
	required string 	user_uuid	= 4;
	required OnlineStat	status		= 5;
	required DeviceType	device_type	= 6;
	required string		user_name	= 7;	// user name used for push notify
	optional string		token		= 8;
        optional string         app_version     = 9;
        optional string         token_type      = 10;
}

// online response message
message OnlineResp {
	required uint32		id	  = 1;
	required int32		errorno = 2;
	optional string		msg   = 3;
	optional string 	access_token = 4;
}

// heartbeat request message
message HeartBeatReq {
	required uint32		id 			= 1;
}

// heartbeat response message
message HeartBeatResp {
	required uint32		id		= 1;
	required int32		errorno 	= 2;
	optional string		msg		= 3;
}

// getuserstatus request message 
message GetUserStatusReq {
	required uint32 id = 1;
}

// getuserstatus response message
message GetUserStatusResp {
	required uint32 id = 1;
	required int32 errorno = 2;
	optional string msg = 3;
	
	message UserStatus {
		required string user_uuid = 1;
		required OnlineStat status = 2;
		required DeviceType device_type = 3;
	}
	
	repeated UserStatus status = 4;
}

// setuserstatus request message 
message ChangeUserStatusReq {
	required uint32 id = 1;
	required OnlineStat status = 2;	
}

// setuserstatus response message
message ChangeUserStatusResp {
	required uint32 id = 1;
	required int32 errorno = 2;
	optional string msg = 3;
}

// logout request message
message LogoutReq {
	required uint32 id = 1;
}

// logout response message
message LogoutResp {
	required uint32 id = 1;
	required int32 errorno = 2;
	optional string msg = 4;
}

// chatpri request message
message ChatPriReq {
        required uint32 id = 1;
	optional IMSessionType session_type = 2;
	required DeviceType device_type = 3;
	required string user_uuid = 4;
	required string chat_obj_uuid = 5;
	required ChagMsgType msg_type = 6;
	required string msg_content = 7;
	required string msg_uuid = 8;
	optional string user_name = 9;
	optional string font = 10;
}

// chatgrp response message
message ChatPriResp {
	required uint32 id = 1;
	required int32 errorno = 2;
	optional string msg = 3;
	required string msg_uuid = 4;
	required uint64 msg_time = 5;
	required uint64 msg_version = 6;
	required uint64 msg_pre_version = 7;
	optional int32 unread_number = 8;
}

// chatgroup request message
message ChatGrpReq {
	required uint32 id = 1;
	optional IMSessionType session_type = 2;
	required DeviceType device_type = 3;
	required string user_uuid = 4;
	required string chat_obj_uuid = 5;
	required ChagMsgType msg_type = 6;
	required string msg_content = 7;
	required string msg_uuid = 8;
    	optional string user_name = 9;
	optional string member_check = 11;
	optional bool is_comp = 12;
	optional string font = 13;

}

// chatgroup response message
message ChatGrpResp {
	required uint32 id = 1;
	required int32 errorno = 2;
	optional string msg = 3;
	required string msg_uuid = 4;
	required uint64 msg_time = 5;
	required uint64 msg_version = 6;
	required uint64 msg_pre_version = 7;
	optional int32 member_check_result = 10;
	optional int32 unread_number = 11;
}

// remind request message
message RemindReq {
	required uint32 id = 1;
	required string user_uuid = 2;
	required string recver_uuid = 3;
	required RemindType remind_type = 4;
	optional string remind_msg = 5;
	optional int32 remind_rnd = 6;
	required DeviceType device_type = 7;
}

// remind response message
message RemindResp {
	required uint32 id = 1;
	required int32 errorno = 2;
	optional string msg = 3;
}

// user status change notify
message UserStatusChangePushNotify {
	required uint32 id = 1;
	required string user_uuid = 2;
	required OnlineStat status = 3;
	required DeviceType device_type = 4;
	optional int32 stattype = 5; 		// ????????????????????
}

