name: iOS Build

# 云端打包：无需本地 Xcode。
# 没配签名 Secrets 时只做「编译校验」并上传未签名产物；
# 配了签名 Secrets 才产出可安装的 IPA（ad-hoc / development / app-store）。
on:
  push:
    branches: [feature/ios-capacitor, main]
    # Web 构建的输入远不止 src：漏了这些就会出现「改了却不重新打包」
    paths:
      - 'ios-app/**'
      - 'src/**'
      - 'static/**'
      - 'build/**'
      - 'config/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.babelrc'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式：app-store（传 TestFlight，推荐）| ad-hoc | development'
        required: true
        default: 'app-store'
      beta_group:
        description: 'TestFlight 测试组名；留空=内部测试组（无需 Beta 审核）'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-14
    env:
      WORKSPACE: ios-app/ios/App/App.xcworkspace
      SCHEME: App
      BUNDLE_ID: com.yugusoft.bian
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
      # secrets 不能用在 if 里，先转成 env 布尔串
      HAS_SIGNING: ${{ secrets.SIGNING_CERTIFICATE_P12 != '' }}
      HAS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: cd ios-app && npm ci

      # 必须在这里重新构建 Web 资源：ios-app/www 是 cap copy 的输入，
      # 不重建就会把仓库里那份旧的 www 打进 IPA（改了 src 却看不到效果）。
      # --ignore-scripts：跳过 phantomjs-prebuilt / chromedriver 等测试依赖的
      #   二进制下载（下载源常年不可达，会让 npm ci 直接失败），构建不需要它们。
      - name: 构建 Web 资源（Vue2 工程在仓库根目录）
        run: |
          set -e
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
          # 必须用 copy-web.sh，不能用 npm run copy:web：
          # 后者只拷 dist，会漏掉 static/（jquery/pixi/jweixin 等老库）和 CDN 外链本地化，打出的是残包
          bash ios-app/copy-web.sh

      - name: 同步 iOS 平台（云端 pod install）
        run: cd ios-app && npx cap sync ios

      # ---------- 有签名材料才走签名流程 ----------
      - name: 导入签名证书与描述文件
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo -n "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          if [ -n "$PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo -n "$PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi

      # 有 App Store Connect API Key 时用它做自动签名：不用手动管描述文件、也不用收集 UDID
      - name: 写入 App Store Connect API Key
        if: env.HAS_SIGNING == 'true' && env.HAS_API_KEY == 'true'
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -e
          mkdir -p private_keys
          echo -n "$API_KEY_P8" | base64 --decode -o "private_keys/AuthKey_$KEY_ID.p8"
          echo "AUTH_FLAGS=-allowProvisioningUpdates -authenticationKeyPath $PWD/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_ENV

      - name: 生成 ExportOptions.plist
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          if [ "$EXPORT_METHOD" = "app-store" ]; then
            # 上架/TestFlight：自动签名，只需 teamID
            cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          EOF
          else
            # Ad Hoc / Development：手动签名，需要描述文件
            cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          fi

      - name: 归档并导出 IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          set -e
          # TestFlight 要求每次上传的 CFBundleVersion 递增，工程里写死的是 1。
          # Info.plist 用的是 $(CURRENT_PROJECT_VERSION)，这里用构建号覆盖即可，不改文件。
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            $AUTH_FLAGS \
            -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ExportOptions.plist $AUTH_FLAGS

      - name: 上传到 TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_API_KEY == 'true' && env.EXPORT_METHOD == 'app-store'
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -e
          IPA=$(ls build/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # 上传完还得把构建加进测试组，否则它只是躺在 TestFlight 列表里，测试员看不到
      - name: 加入 TestFlight 测试组
        if: env.HAS_SIGNING == 'true' && env.HAS_API_KEY == 'true' && env.EXPORT_METHOD == 'app-store'
        env:
          # 上一步已把 p8 解码到仓库根目录的 private_keys/ 下，这里直接复用
          ASC_KEY_PATH: private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          BETA_GROUP: ${{ github.event.inputs.beta_group || '' }}
        run: ruby ios-app/ci/add-build-to-beta-group.rb

      # ---------- 没签名材料：产出未签名 IPA，供 Sideloadly / AltStore 用 Apple ID 自签安装 ----------
      - name: 编译并打包未签名 IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          set -e
          # 个人 Apple ID 自签不支持 Sign in with Apple / 关联域名，这里清空 entitlements 以免装不上
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build/dd
          APP=build/dd/Build/Products/Debug-iphoneos/App.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa && zip -qr Bian-unsigned.ipa Payload
          echo "产出：$(pwd)/Bian-unsigned.ipa"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/ipa/*.ipa
          if-no-files-found: warn
