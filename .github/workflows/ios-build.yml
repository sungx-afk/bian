name: iOS Build

# 云端打包：无需本地 Xcode。
# 没配签名 Secrets 时只做「编译校验」并上传未签名产物；
# 配了签名 Secrets 才产出可安装的 IPA（ad-hoc / development / app-store）。
on:
  push:
    branches: [feature/ios-capacitor, main]
    # Web 构建的输入远不止 src：漏了这些就会出现「改了却不重新打包」
    paths:
      - 'ios-app/**'
      - 'src/**'
      - 'static/**'
      - 'build/**'
      - 'config/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.babelrc'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式：app-store（传 TestFlight，推荐）| ad-hoc | development'
        required: true
        default: 'app-store'
      beta_group:
        description: 'TestFlight 测试组名；留空=内部测试组（无需 Beta 审核）'
        required: false
        default: ''

jobs:
  build:
    # macos-14（Sonoma）默认 Xcode 15.4，且该镜像 2026-11-02 起彻底下线。
    # Xcode 26 需要 macOS 15+，而 macos-15 镜像自带 Xcode 26.0.1 / 26.1.1 / 26.2 / 26.3。
    runs-on: macos-15
    env:
      WORKSPACE: ios-app/ios/App/App.xcworkspace
      SCHEME: App
      BUNDLE_ID: com.yugusoft.bian
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store' }}
      # secrets 不能用在 if 里，先转成 env 布尔串
      HAS_SIGNING: ${{ secrets.SIGNING_CERTIFICATE_P12 != '' || secrets.SIGNING_PRIVATE_KEY != '' }}
      HAS_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Apple 自 2026 年起硬性要求：所有 iOS/iPadOS App 必须用 iOS 26 SDK（Xcode 26+）构建，
      # 否则上传时直接被拒：Validation failed (409) SDK version issue。
      # macos-15 镜像默认是 Xcode 16.4，必须显式切到 26.x。
      - name: 选择 Xcode 26+
        run: |
          set -e
          XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::镜像里没有 Xcode 26，无法上传 App Store Connect"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
          VER=$(xcodebuild -version | awk 'NR==1{print $2}')
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "已选择 Xcode $VER（iOS SDK $SDK），路径 $XC"
          MAJOR=${VER%%.*}
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::error::Xcode $VER 过低，Apple 要求 iOS 26 SDK 及以上"
            exit 1
          fi

      # 前置自检：只报「有没有、多长」，不打印内容。
      # 否则缺 Secret 时的表现是「签名/上传全部 skipped 然后构建成功」，极易误判为上传成功。
      - name: 签名材料自检
        env:
          KEY_PEM: ${{ secrets.SIGNING_PRIVATE_KEY }}
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERT_CER: ${{ secrets.SIGNING_CERTIFICATE_CER }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -e
          report() {
            if [ -n "$2" ]; then
              printf '  [有] %-34s %s 字符\n' "$1" "${#2}"
            else
              printf '  [无] %-34s 未配置\n' "$1"
            fi
          }
          echo "=== 签名材料自检（只显示长度，不显示内容）==="
          report SIGNING_PRIVATE_KEY "$KEY_PEM"
          report SIGNING_CERTIFICATE_P12 "$P12_BASE64"
          report SIGNING_CERTIFICATE_CER "$CERT_CER"
          report PROVISIONING_PROFILE "$PROFILE_B64"
          report PROVISIONING_PROFILE_NAME "$PROFILE_NAME"
          report APPLE_TEAM_ID "$TEAM_ID"
          report APP_STORE_CONNECT_API_KEY_P8 "$API_P8"
          report APP_STORE_CONNECT_KEY_ID "$API_KEY_ID"
          report APP_STORE_CONNECT_ISSUER_ID "$API_ISSUER"
          echo "本次判定：HAS_SIGNING=$HAS_SIGNING  HAS_API_KEY=$HAS_API_KEY  EXPORT_METHOD=$EXPORT_METHOD"
          # 下面用 error 注解（不会让 job 失败），让问题直接顶到运行页的 Annotations 里
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::error::没有签名材料（SIGNING_PRIVATE_KEY 与 SIGNING_CERTIFICATE_P12 都为空）——签名、归档、上传步骤会被全部跳过，本次不会产出可安装包。请到 Settings → Secrets and variables → Actions 的【Repository secrets】补齐（注意不是 Environment secrets）。"
          elif [ "$HAS_API_KEY" != "true" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 为空——无法自动签发证书，也无法上传 TestFlight。"
          else
            echo "签名材料齐备，将走签名 + 上传流程。"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: cd ios-app && npm ci

      # 必须在这里重新构建 Web 资源：ios-app/www 是 cap copy 的输入，
      # 不重建就会把仓库里那份旧的 www 打进 IPA（改了 src 却看不到效果）。
      # --ignore-scripts：跳过 phantomjs-prebuilt / chromedriver 等测试依赖的
      #   二进制下载（下载源常年不可达，会让 npm ci 直接失败），构建不需要它们。
      - name: 构建 Web 资源（Vue2 工程在仓库根目录）
        run: |
          set -e
          npm ci --ignore-scripts --legacy-peer-deps
          npm run build
          # 必须用 copy-web.sh，不能用 npm run copy:web：
          # 后者只拷 dist，会漏掉 static/（jquery/pixi/jweixin 等老库）和 CDN 外链本地化，打出的是残包
          bash ios-app/copy-web.sh

      - name: 同步 iOS 平台（云端 pod install）
        run: cd ios-app && npx cap sync ios

      # ---------- 有签名材料才走签名流程 ----------
      # 两种来源都支持：
      #   A) SIGNING_PRIVATE_KEY + 证书（推荐）：私钥由本仓库的一次性 workflow
      #      「Generate Signing CSR」产生，本机钥匙串全程不参与，这里当场合成 p12
      #   B) SIGNING_CERTIFICATE_P12：直接提供已经导好的 p12（老方式）
      - name: 组装并导入签名证书
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEY_PEM: ${{ secrets.SIGNING_PRIVATE_KEY }}
          CER_BASE64: ${{ secrets.SIGNING_CERTIFICATE_CER }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
          PROFILE_FILE: ios-app/ci/bian-appstore.mobileprovision
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          # Homebrew 的 OpenSSL 3 默认用新算法加密 p12，macOS 钥匙串读不出来，
          # 统一改用系统自带的 LibreSSL，产出的格式才是 Apple 这套工具链认的。
          OPENSSL=/usr/bin/openssl
          [ -x "$OPENSSL" ] || OPENSSL=$(command -v openssl)

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          if [ -n "$KEY_PEM" ]; then
            echo "证书来源：SIGNING_PRIVATE_KEY + 分发证书（私钥由本仓库生成，本机不参与）"
            printf '%s\n' "$KEY_PEM" > "$RUNNER_TEMP/apple-distribution.key"
            # 证书（公开数据）可以放在仓库里，直接从 GitHub 网页上传，连 base64 都省了
            if [ -f ios-app/ci/apple-distribution.cer ]; then
              CER_FILE=ios-app/ci/apple-distribution.cer
            elif [ -n "$CER_BASE64" ]; then
              echo -n "$CER_BASE64" | base64 --decode -o "$RUNNER_TEMP/cer.der"
              CER_FILE="$RUNNER_TEMP/cer.der"
            else
              echo "::error::找不到分发证书：把 Portal 下载的 .cer 放进 ios-app/ci/apple-distribution.cer，或填 Secret SIGNING_CERTIFICATE_CER"
              exit 1
            fi
            # Portal 下载的一般是 DER，仓库里也可能是 PEM，两种都接受
            "$OPENSSL" x509 -inform der -in "$CER_FILE" -out "$RUNNER_TEMP/apple-distribution.pem" 2>/dev/null \
              || "$OPENSSL" x509 -inform pem -in "$CER_FILE" -out "$RUNNER_TEMP/apple-distribution.pem"
            # 私钥与证书必须配对，不配对的话要到 codesign 阶段才报错，很难排查
            KEY_MD5=$("$OPENSSL" pkey -in "$RUNNER_TEMP/apple-distribution.key" -pubout | openssl md5)
            CER_MD5=$("$OPENSSL" x509 -in "$RUNNER_TEMP/apple-distribution.pem" -noout -pubkey | openssl md5)
            if [ "$KEY_MD5" != "$CER_MD5" ]; then
              echo "::error::私钥与证书不配对（key=$KEY_MD5 cert=$CER_MD5），确认上传的 CSR 就是用这把私钥生成的"
              exit 1
            fi
            "$OPENSSL" pkcs12 -export -out "$RUNNER_TEMP/cert.p12" \
              -inkey "$RUNNER_TEMP/apple-distribution.key" \
              -in "$RUNNER_TEMP/apple-distribution.pem" \
              -name "Apple Distribution (GitHub Actions)" \
              -passout pass:"$KEYCHAIN_PASSWORD"
            P12_PASSWORD="$KEYCHAIN_PASSWORD"
          elif [ -n "$P12_BASE64" ]; then
            echo "证书来源：SIGNING_CERTIFICATE_P12（旧方式）"
            echo -n "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          else
            echo "::error::缺少签名材料：先跑 Actions → Generate Signing CSR，再把私钥存成 SIGNING_PRIVATE_KEY"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # 自检：CI 上没有 Xcode GUI，签名失败时 xcodebuild 的报错很含糊、
          # 而且会伪装成「描述文件」问题。这里先把证据打出来并检查 team 是否对得上，
          # 不匹配就直接失败，省一轮构建。
          echo "=== keychain 中可用的签名身份 ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "=== p12 内证书信息（subject 里的 OU 就是 Team ID）==="
          "$OPENSSL" pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin pass:"$P12_PASSWORD" -nokeys -clcerts 2>/dev/null \
            | "$OPENSSL" x509 -noout -subject -dates 2>/dev/null || echo "(p12 解析失败，请检查密码与格式)"
          # 以 keychain 能否真正形成「签名身份」为准：
          # openssl 统计私钥数量在某些新算法 p12 上不可靠，容易误报
          IDENT_COUNT=$(security find-identity -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep -c ")" || true)
          echo "keychain 中可用签名身份数量：$IDENT_COUNT"
          if [ "$IDENT_COUNT" -eq 0 ]; then
            echo "::error::证书已导入但 keychain 里没有可用的签名身份（通常是 p12 缺少私钥）"
            exit 1
          fi
          # Apple 的证书类型极易混淆，把最常见的错类型直接挡住
          if security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -qi "Developer ID"; then
            echo "::error::这是 macOS 的 Developer ID 证书，只能签 Mac 软件；iOS 上架需要 Apple Distribution 证书"
            exit 1
          fi
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -qi "Apple Distribution"; then
            echo "::warning::keychain 里看起来不是 Apple Distribution 证书，请确认证书类型是否正确"
          fi
          P12_TEAM=$("$OPENSSL" pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin pass:"$P12_PASSWORD" -nokeys -clcerts 2>/dev/null | "$OPENSSL" x509 -noout -subject 2>/dev/null | grep -oE 'OU=[A-Z0-9]{10}' | head -1 | cut -d= -f2 || true)
          echo "p12 Team ID = ${P12_TEAM:-未解析} / APPLE_TEAM_ID = $TEAM_ID"
          if [ -n "$P12_TEAM" ] && [ "$P12_TEAM" != "$TEAM_ID" ]; then
            echo "::error::p12 的 Team ID 与 APPLE_TEAM_ID 不一致，该证书不属于此团队"
            exit 1
          fi

          # 描述文件同理，优先取仓库里的文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -f "$PROFILE_FILE" ]; then
            cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          elif [ -n "$PROFILE_BASE64" ]; then
            echo -n "$PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          else
            echo "::error::找不到 App Store 描述文件：把 Portal 下载的 .mobileprovision 放进 ios-app/ci/bian-appstore.mobileprovision，或填 Secret PROVISIONING_PROFILE"
            exit 1
          fi

      # 有 App Store Connect API Key 时用它做自动签名：不用手动管描述文件、也不用收集 UDID
      - name: 写入 App Store Connect API Key
        if: env.HAS_SIGNING == 'true' && env.HAS_API_KEY == 'true'
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -e
          mkdir -p private_keys
          echo -n "$API_KEY_P8" | base64 --decode -o "private_keys/AuthKey_$KEY_ID.p8"
          echo "AUTH_FLAGS=-allowProvisioningUpdates -authenticationKeyPath $PWD/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_ENV

      - name: 生成 ExportOptions.plist
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          # 一律手动签名。之前用 automatic 时，Xcode 在 archive 阶段坚持要用「开发证书 +
          # 开发描述文件」，而 CI 每次都是新机器，它想先吊销账号上属于本机的那张开发证书
          # （Revoke certificate ... Xcode can create a new one after revoking），
          # 非交互环境下必然失败。手动签名直接用分发证书 + App Store 描述文件，绕开这一步。
          if [ -z "$PROFILE_NAME" ]; then
            echo "::error::缺少 PROVISIONING_PROFILE_NAME，请填 Portal 里描述文件的名称（如 Bian AppStore）"
            exit 1
          fi
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF

      - name: 归档并导出 IPA
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -e
          # 手动签名：直接指定分发证书 + 描述文件，Xcode 不再参与证书管理。
          # Pods 已在 Podfile 的 post_install 里关闭签名，所以这里的全局参数不会误伤它们。
          if [ "$EXPORT_METHOD" = "development" ]; then
            SIGN_IDENTITY="Apple Development"
          else
            SIGN_IDENTITY="Apple Distribution"
          fi
          # TestFlight 要求每次上传的 CFBundleVersion 递增，工程里写死的是 1。
          # Info.plist 用的是 $(CURRENT_PROJECT_VERSION)，这里用构建号覆盖即可，不改文件。
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            $AUTH_FLAGS \
            -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ExportOptions.plist \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" $AUTH_FLAGS

      - name: 上传到 TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_API_KEY == 'true' && env.EXPORT_METHOD == 'app-store'
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -e
          IPA=$(ls build/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # 上传完还得把构建加进测试组，否则它只是躺在 TestFlight 列表里，测试员看不到
      - name: 加入 TestFlight 测试组
        if: env.HAS_SIGNING == 'true' && env.HAS_API_KEY == 'true' && env.EXPORT_METHOD == 'app-store'
        env:
          # 上一步已把 p8 解码到仓库根目录的 private_keys/ 下，这里直接复用
          ASC_KEY_PATH: private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          BETA_GROUP: ${{ github.event.inputs.beta_group || '' }}
        run: ruby ios-app/ci/add-build-to-beta-group.rb

      # ---------- 没签名材料：产出未签名 IPA，供 Sideloadly / AltStore 用 Apple ID 自签安装 ----------
      - name: 编译并打包未签名 IPA
        if: env.HAS_SIGNING != 'true'
        run: |
          set -e
          # 个人 Apple ID 自签不支持 Sign in with Apple / 关联域名，这里清空 entitlements 以免装不上
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build/dd
          APP=build/dd/Build/Products/Debug-iphoneos/App.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa && zip -qr Bian-unsigned.ipa Payload
          echo "产出：$(pwd)/Bian-unsigned.ipa"
          echo "::warning::本次是【未签名】构建：没有归档、没有上传 TestFlight。若你的目的是传 TestFlight，请先补齐签名 Secrets。"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            build/ipa/*.ipa
          if-no-files-found: warn
