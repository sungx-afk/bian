# Codemagic 云端打包配置（云端 macOS 构建机，本机无需安装 Xcode / CocoaPods）
# 文档：https://docs.codemagic.io/yaml-basic-configuration/
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.yugusoft.bian"
      # Codemagic -> Teams -> Integrations 里填入以下变量（勿写进仓库）：
      #   APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_KEY_IDENTIFIER
      #   APP_STORE_CONNECT_PRIVATE_KEY   (.p8 文件内容，含 -----BEGIN PRIVATE KEY-----)
      #   CERTIFICATE_PRIVATE_KEY         (分发证书的私钥)
      #   APP_STORE_CONNECT_KEY / APP_STORE_CONNECT_KEY_PASSWORD 等由 Integration 提供
      groups:
        - app_store_credentials
    triggering:
      # Codemagic 侧统一改为「只手动触发」： Tag/分支 都交给 GitHub Actions
      # （.github/workflows/ios-build.yml），两条流水线同时跑会各算各的 build number，
      # 同时上传 TestFlight 必然冲突。
      # 需要用 Codemagic 时：在 Codemagic 后台点 Start new build 手动跑，
      # 或者把下面的 include 改回 true。
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: false
      tag_patterns:
        - pattern: '*'
          include: false
    scripts:
      - name: 安装 npm 依赖
        script: |
          cd ios-app
          npm ci
      - name: 构建 Web 资源（Vue2 工程在仓库根目录）
        script: |
          set -e
          npm ci --ignore-scripts --legacy-peer-deps
          # ASSET_PUBLIC_PATH=/ 必须显式给：不设的话 webpack.prod.conf.js 会把
          # publicPath 落到七牛 CDN 域名上，index.html 里的 manifest/vendor/app
          # 会去请求线上 CDN（CDN 上没有这次的 hash → 404 → 白屏）
          ASSET_PUBLIC_PATH=/ npm run build
          # 必须用 copy-web.sh，不能用 npm run copy:web：后者只拷 dist，会漏掉 static/ 与 CDN 本地化
          bash ios-app/copy-web.sh
      - name: 递增 build number
        script: |
          cd ios-app/ios/App
          # TestFlight 要求 CFBundleVersion 递增，pbxproj 里写死的是 1。
          # agvtool 是 Xcode 自带工具，把 Info.plist 的 CFBundleVersion 改成指定值。
          xcrun agvtool new-version -all "${BUILD_NUMBER:?Codemagic 未注入 BUILD_NUMBER}"
      - name: 同步 Web 资源与 iOS 平台（云端执行 pod install）
        script: |
          cd ios-app
          npx cap sync ios
      - name: 构建并自动签名 IPA
        script: |
          cd ios-app
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive \
            --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
    publishing:
      email:
        recipients:
          - liushuang@yugusoft.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - 内部测试组

  ios-adhoc:
    name: iOS Ad Hoc（指定设备）
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios-app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.yugusoft.bian"
      groups:
        - app_store_credentials
    triggering:
      # 同 ios-testflight：默认全关，只用 Codemagic 后台的 Start new build 手动触发。
      # 以前这里没有 triggering，Codemagic 会对每次 push/tag 都拉起一次 Ad Hoc 构建。
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: false
      tag_patterns:
        - pattern: '*'
          include: false
    scripts:
      - name: 安装 npm 依赖
        script: |
          cd ios-app
          npm ci
      - name: 构建 Web 资源（Vue2 工程在仓库根目录）
        script: |
          set -e
          npm ci --ignore-scripts --legacy-peer-deps
          # ASSET_PUBLIC_PATH=/ 必须显式给：不设的话 webpack.prod.conf.js 会把
          # publicPath 落到七牛 CDN 域名上，index.html 里的 manifest/vendor/app
          # 会去请求线上 CDN（CDN 上没有这次的 hash → 404 → 白屏）
          ASSET_PUBLIC_PATH=/ npm run build
          # 必须用 copy-web.sh，不能用 npm run copy:web：后者只拷 dist，会漏掉 static/ 与 CDN 本地化
          bash ios-app/copy-web.sh
      - name: 递增 build number
        script: |
          cd ios-app/ios/App
          xcrun agvtool new-version -all "${BUILD_NUMBER:?Codemagic 未注入 BUILD_NUMBER}"
      - name: 同步 Web 资源与 iOS 平台
        script: |
          cd ios-app
          npx cap sync ios
      - name: 构建 Ad Hoc 包（设备需已注册 UDID）
        script: |
          cd ios-app
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-method ad-hoc
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - liushuang@yugusoft.com
        notify:
          success: true
          failure: true
