<script type="text/javascript">
  var debug = true;
  var router = {
    default:{

    },
    init:function(){
     	this.initParam()
    },
    initParam:function(){
      let url = ''
      let request = getRequest()
      let state = request['state']
      if (state == 'wechat_state'){
      	let code = request['code']
      	url = `./index.html#/home?code=${code}&state=${state}`
      }
      
      url && window.location.replace(url)
    },
    browserRedirect:function() {
        return 'wechat'
    }
  }

  router.init();

</script>
